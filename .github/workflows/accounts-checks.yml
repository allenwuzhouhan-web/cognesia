name: Public account service checks
on:
  workflow_dispatch:
  push:
    paths: ['services/accounts/**', 'site/account.css', 'site/icon.svg', 'src/flybrain/app_access.py', '.github/workflows/accounts-checks.yml']
  pull_request:
    paths: ['services/accounts/**', 'site/account.css', 'site/icon.svg', 'src/flybrain/app_access.py', '.github/workflows/accounts-checks.yml']
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund && npm --prefix functions ci --no-audit --no-fund
        working-directory: services/accounts
      - run: npm run build && npm test && npm run test:integration
        working-directory: services/accounts
        env:
          COGNESIA_PYTHON: python
      - run: npm run build:netlify && npx netlify functions:build --src netlify/functions --functions .netlify/functions
        working-directory: services/accounts
        env:
          COGNESIA_FIREBASE_WEB_CONFIG: '{"apiKey":"ci-public-config-placeholder","authDomain":"cognesia-accounts.firebaseapp.com","projectId":"cognesia-accounts","appId":"ci-public-app-placeholder"}'
