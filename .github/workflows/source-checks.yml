name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]' build
      - name: Audit source upload boundaries
        run: python scripts/prepare_public_release.py --check
      - name: Check release tools
        run: python -m pytest -q tests/test_public_release.py
      - name: Check model and application regressions
        run: python -m pytest -q -m 'not integration and not slow'
      - name: Verify ParaLimbo 1 published benchmark arithmetic
        run: python scripts/verify_paralimbo_1_publication.py
      - name: Verify completed transmission campaign evidence
        run: python scripts/verify_transmission_publication.py
      - name: Verify ParaLimbo 1 frozen model source
        run: |
          python models/paralimbo-1/scripts/check_source.py
          PYTHONPATH=models/paralimbo-1/src python -m pytest -c models/paralimbo-1/pyproject.toml models/paralimbo-1/tests -q
          python -m build models/paralimbo-1 --outdir /tmp/paralimbo-1-dist
      - name: Check browser modules and desktop bridge
        run: node --test tests/test_web_*.mjs macos/test_desktop_bridge.mjs macos/test_research_bridge.mjs
      - name: Build source package wheel
        run: python -m build --wheel
      - name: Verify packaged licenses and notices
        run: |
          for license_wheel in dist/*.whl; do
            COGNESIA_LICENSE_WHEEL="$license_wheel" python -m pytest -q tests/test_third_party_licenses.py
          done
