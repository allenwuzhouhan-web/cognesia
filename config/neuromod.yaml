source_policy:
  identity:
    value: positive_known_nt_only
    unit: selection_rule
    source: DOI:10.1038/s41586-024-07686-5
    note: Split known_nt on comma/semicolon; drop fragments ending in -negative. top_nt
      is audit evidence only.
  kc_aminergic_exclusion:
    value: true
    unit: assertion
    source: PMID:26948892
    note: 'Defect D: known cholinergic KCs cannot become aminergic sources through
      top_nt.'
  kc_peptide_conflict:
    value: retain_positive_snpf_independently
    unit: audit_interpretation
    source: ASSUMPTION
    note: 'NEUROMOD_PATCH1.md section 3 resolves the conflict: exclude KCs from aminergic
      sources, retain 4133 KC sNPF and 5034 whole-annotation sNPF sources.'
  expected_counts:
    value: primary_data_exact_population_selector_authoritative
    unit: assertion
    source: ASSUMPTION
    note: 'NEUROMOD_PATCH1.md section 1.2: stop on primary-data or software-integrity
      mismatch; report definition-count disagreements and proceed using normative
      selectors.'
compartment_policy:
  clustering:
    value: average_linkage_Jaccard_15
    unit: method
    source: ASSUMPTION
    note: DAN to KC outputs and KC to MBON inputs; binary partner vectors, lexicographic
      type order, hemispheres pooled. Clustering fixed before canonical label alignment.
  canonical_alignment:
    value: Hungarian_fractional_type_votes
    unit: method
    source: ASSUMPTION
    note: One over published compartment-count vote; keep zero-support labels and
      disagreements visible. Published anatomy never changes empirical cluster membership.
  membership:
    value: KC_partner_proxy
    unit: selection_rule
    source: ASSUMPTION
    note: KC belongs to each empirical compartment containing an observed DAN/MBON
      partner. This is not a measured release-site map.
  adjacency:
    value: coarse_neighbor_graph
    unit: topology
    source: ASSUMPTION
    note: Consecutive MB lobe slices, consecutive FB layers and coarse optic neighbors;
      no AL adjacency without geometry.
