(() =&gt; {
  const root = document.getElementById(&#x27;paralimbo-1-benchmarks&#x27;);
  const data = JSON.parse(root.querySelector(&#x27;[data-native-data]&#x27;).textContent);
  const d3 = window.d3;
  if (!d3) { root.querySelector(&#x27;[data-headline]&#x27;).textContent = &#x27;Chart library unavailable&#x27;; return; }
  const modelIds = [&#x27;banc-888&#x27;,&#x27;paralimbo-v0-1-0&#x27;,&#x27;paralimbo-visual-graded-v1&#x27;,&#x27;zero-response&#x27;];
  const colors = {&#x27;banc-888&#x27;:&#x27;var(--viz-series-2)&#x27;,&#x27;paralimbo-v0-1-0&#x27;:&#x27;var(--viz-series-1)&#x27;,
    &#x27;paralimbo-visual-graded-v1&#x27;:&#x27;var(--viz-series-3)&#x27;,&#x27;zero-response&#x27;:&#x27;var(--viz-series-4)&#x27;,&#x27;observed&#x27;:&#x27;var(--foreground)&#x27;};
  const labelLines = {&#x27;banc-888&#x27;:[&#x27;BANC&#x27;],&#x27;paralimbo-v0-1-0&#x27;:[&#x27;Original&#x27;,&#x27;ParaLimbo 0.1&#x27;],
    &#x27;paralimbo-visual-graded-v1&#x27;:[&#x27;ParaLimbo 1&#x27;],&#x27;zero-response&#x27;:[&#x27;Zero-response&#x27;,&#x27;baseline&#x27;]};
  const curveNames = {...data.models, observed:data.counts.scored_repeats_per_condition===1?&#x27;Recorded trial&#x27;:&#x27;Recorded mean ± SEM&#x27;};
  const traceHint = data.counts.scored_repeats_per_condition===1?&#x27;One paired recorded trial; no error band. Tap a time to pin all visible values.&#x27;:`Recorded band: SEM across ${data.counts.scored_repeats_per_condition} repeats. Tap a time to pin all visible values.`;
  const toggles = [&#x27;observed&#x27;,...modelIds];
  const state = {sensitivity:&#x27;primary&#x27;,caseId:data.cases[0].id,visible:Object.fromEntries(toggles.map(id=&gt;[id,true])),pinnedTime:null};
  const selectSensitivity = root.querySelector(&#x27;[data-sensitivity]&#x27;);
  const selectCase = root.querySelector(&#x27;[data-case]&#x27;);
  const tooltip = root.querySelector(&#x27;[data-shared-tooltip]&#x27;);
  const plots = new Map();
  let traceContext = null;
  const full = value =&gt; value === null ? &#x27;Unscored&#x27; : String(Number(Number(value).toPrecision(12)));
  const short = value =&gt; value === null ? &#x27;Unscored&#x27; : d3.format(&#x27;.5~g&#x27;)(value);
  const group = (model,sensitivity=state.sensitivity) =&gt; data.groups.find(g=&gt;g.model_id===model &amp;&amp; g.sensitivity_id===sensitivity);
  const endpoint = (model,metric) =&gt; model===&#x27;zero-response&#x27; ? data.zero[metric] : group(model).endpoints[metric];
  const comparator = (model,metric) =&gt; data.comparisons.find(c=&gt;c.model_id===model&amp;&amp;c.metric===metric&amp;&amp;c.sensitivity_id===state.sensitivity);
  const reduced = () =&gt; window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  function remember() {
    const saved={modelContent:{comparison:&#x27;native ParaLimbo vs BANC&#x27;,sensitivity:state.sensitivity,case_id:state.caseId},privateContent:{visible:state.visible,pinnedTime:state.pinnedTime}};
    if(window.openai?.setWidgetState) window.openai.setWidgetState(saved).catch(()=&gt;{});
  }
  function applySaved(saved) {
    if(!saved) return;
    const useful=saved.modelContent||{}, ui=saved.privateContent||{};
    if(data.sensitivities[useful.sensitivity]) state.sensitivity=useful.sensitivity;
    if(data.cases.some(c=&gt;c.id===useful.case_id)) state.caseId=useful.case_id;
    if(ui.visible) toggles.forEach(id=&gt;{if(typeof ui.visible[id]===&#x27;boolean&#x27;)state.visible[id]=ui.visible[id];});
    if(Number.isFinite(ui.pinnedTime)) state.pinnedTime=ui.pinnedTime;
  }
  function summary() {
    const candidates=modelIds.slice(1,3).map(id=&gt;{
      const rows=data.comparisons.filter(r=&gt;r.model_id===id&amp;&amp;r.sensitivity_id===state.sensitivity);
      return {id,exact:rows.every(r=&gt;r.banc_minus_paralimbo_mv===0),win:rows.filter(r=&gt;r.verdict===&#x27;PARALIMBO_LOWER_ERROR&#x27;).length,
        loss:rows.filter(r=&gt;r.verdict===&#x27;BANC_LOWER_ERROR&#x27;).length,
        tie:rows.filter(r=&gt;r.verdict===&#x27;WITHIN_NUMERICAL_SEPARATION&#x27;).length,
        missing:rows.filter(r=&gt;r.verdict===&#x27;UNSCORED&#x27;).length};
    });
    const incomplete=candidates.some(c=&gt;c.missing);
    const winners=candidates.filter(c=&gt;c.win&gt;0);
    let headline;
    if(incomplete) headline=&#x27;Native comparison incomplete&#x27;;
    else if(!winners.length) headline=&#x27;No ParaLimbo advantage beyond numerical separation&#x27;;
    else if(winners.length===1) headline=`${data.models[winners[0].id]}: lower error on ${winners[0].win} of 5 endpoints`;
    else headline=&#x27;Both ParaLimbo variants lower error on some endpoints&#x27;;
    root.querySelector(&#x27;[data-headline]&#x27;).textContent=headline;
    const container=root.querySelector(&#x27;[data-candidate-summary]&#x27;);container.replaceChildren();
    candidates.forEach(c=&gt;{
      const line=document.createElement(&#x27;div&#x27;);const name=document.createElement(&#x27;strong&#x27;);name.textContent=data.models[c.id]+&#x27;: &#x27;;
      line.append(name,document.createTextNode(c.exact?&#x27;Exact tie with BANC on all 5 endpoints.&#x27;:`${c.win} lower error · ${c.loss} BANC lower · ${c.tie} within separation${c.missing?&#x27; · &#x27;+c.missing+&#x27; unscored&#x27;:&#x27;&#x27;} · Motion waveform: ${verdict(comparator(c.id,&#x27;motion_waveform_rmse&#x27;))}`));container.append(line);
    });
    const failures=data.failures.filter(f=&gt;f.sensitivity_id===state.sensitivity).length;
    const failureLabel=root.querySelector(&#x27;[data-failures]&#x27;);
    failureLabel.textContent=failures?`${failures} of ${data.counts.condition_count*data.counts.scored_repeats_per_condition*3} native trial requests failed qualification`: `${data.counts.condition_count*data.counts.scored_repeats_per_condition*3}/${data.counts.condition_count*data.counts.scored_repeats_per_condition*3} native requests passed numerical checks · biological validation not established`;
    failureLabel.classList.toggle(&#x27;text-destructive&#x27;,failures&gt;0);
  }
  function verdict(row) {
    if(row.verdict===&#x27;UNSCORED&#x27;) return &#x27;Unscored&#x27;;
    if(row.verdict===&#x27;WITHIN_NUMERICAL_SEPARATION&#x27;) return `Within ${full(row.numerical_separation_mv)} mV separation`;
    const relative=row.banc_score?` (${d3.format(&#x27;.3f&#x27;)(100*Math.abs(row.banc_minus_paralimbo_mv)/row.banc_score)}%)`:&#x27;&#x27;;
    return row.verdict===&#x27;PARALIMBO_LOWER_ERROR&#x27; ? `Lower error by ${short(row.banc_minus_paralimbo_mv)} mV${relative}` : `BANC lower by ${short(-row.banc_minus_paralimbo_mv)} mV${relative}`;
